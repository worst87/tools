<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Worst Toolkit — molecular biology tools in one place</title>
  <meta name="description" content="A clean, free collection of everyday molecular biology tools: sequence cleanup, DNA/RNA/protein conversion, primer Tm, compare & search, cloning calculators, and a node-based workflow builder." />
  <link rel="icon" href="assets/mark.svg" />
  <link rel="stylesheet" href="assets/css/style.css" />
  <link rel="stylesheet" href="assets/css/workbench.css" />
</head>
<body>
  <header class="nav">
    <div class="nav-inner">
      <a class="brand" href="#/">
        <img class="brand-mark" src="assets/mark.svg" alt="" />
        Worst Toolkit
      </a>
      <nav class="nav-links" aria-label="Main navigation">
        <a href="#/" data-route="home">Directory</a>
        <a href="#/workflow" data-route="workflow">Workflow</a>
        <a href="#/coding" data-route="coding">Coding</a>
        <a href="#/about" data-route="about">About</a>
        <button class="theme-toggle" id="themeToggle" title="Toggle light/dark" aria-label="Toggle light and dark theme">◐</button>
      </nav>
    </div>
  </header>

  <main id="app"></main>

  <!-- ===== Scripts: core → tools (self-register) → workflow → app ========= -->
  <script src="assets/js/core/registry.js"></script>
  <script src="assets/js/core/bioseq.js"></script>
  <script src="assets/js/core/motif.js"></script>
  <script src="assets/js/core/ui.js"></script>
  <script src="assets/js/core/field-views.js"></script>
  <script src="assets/js/core/logger.js"></script>
  <!-- tools: Cleanup & Format -->
  <script src="assets/js/tools/clean-sequence.js"></script>
  <script src="assets/js/tools/find-replace.js"></script>
  <script src="assets/js/tools/scratchpad.js"></script>
  <!-- tools: Sequence Tools -->
  <script src="assets/js/tools/sequence-converter.js"></script>
  <script src="assets/js/tools/reading-frames.js"></script>
  <script src="assets/js/tools/sequence-stats.js"></script>
  <script src="assets/js/tools/tm-calculator.js"></script>
  <script src="assets/js/tools/sequence-find.js"></script>
  <script src="assets/js/tools/grab-flanking.js"></script>
  <script src="assets/js/tools/degenerate-bases.js"></script>
  <script src="assets/js/tools/diff.js"></script>
  <script src="assets/js/tools/join-sequences.js"></script>
  <!-- tools: Calculators -->
  <script src="assets/js/tools/dilution-calculator.js"></script>
  <script src="assets/js/tools/ligation-calculator.js"></script>
  <script src="assets/js/tools/mass-moles.js"></script>
  <script src="assets/js/tools/gibson.js"></script>
  <script src="assets/js/tools/master-mix.js"></script>
  <!-- tools: Coding / WSL canvas (group:'code') — framework helper loads first,
       then one line per tool. See assets/js/tools-code/README.md for the recipe. -->
  <script src="assets/js/tools-code/_codelib.js"></script>
  <script src="assets/js/tools-code/wsl-path.js"></script>
  <script src="assets/js/tools-code/fastq.js"></script>
  <script src="assets/js/tools-code/seqkit.js"></script>
  <script src="assets/js/tools-code/loop.js"></script>
  <script src="assets/js/tools-code/align.js"></script>
  <script src="assets/js/tools-code/samtools.js"></script>
  <script src="assets/js/tools-code/samtools-stats.js"></script>
  <script src="assets/js/tools-code/bam-to-csv.js"></script>
  <script src="assets/js/tools-code/docker-run.js"></script>
  <script src="assets/js/tools-code/script-out.js"></script>
  <!-- workflow engine (powers BOTH the Workflow and Coding canvases) + app shell -->
  <script src="assets/js/workflow/workflow.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
